<title>Quadro de Ocorrências</title>
<style>
:root{--bg:#f4f5f2;--surface:#fff;--fg:#1d2420;--muted:#5d6760;--line:#dcdfd9;--accent:#c2410c;--accent-fg:#fff;--ok:#2f7d4f;--warn:#b45309;--open:#b91c1c;--chip:#ecefe9;--shadow:0 1px 2px rgba(20,30,25,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--surface:#1c221e;--fg:#e8ece8;--muted:#9aa59d;--line:#2f3832;--accent:#fb923c;--accent-fg:#1a1208;--ok:#5fbf86;--warn:#f0b254;--open:#f87171;--chip:#262e29;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141815;--surface:#1c221e;--fg:#e8ece8;--muted:#9aa59d;--line:#2f3832;--accent:#fb923c;--accent-fg:#1a1208;--ok:#5fbf86;--warn:#f0b254;--open:#f87171;--chip:#262e29;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.4rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.warn{background:var(--chip);border-left:3px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:.85rem;color:var(--muted)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{flex:1 1 90px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.count b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg)}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{flex:1 1 160px;width:auto}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0}
.item[data-s="aberta"]{border-left-color:var(--open)}
.item[data-s="atendimento"]{border-left-color:var(--warn)}
.item[data-s="concluida"]{border-left-color:var(--ok)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.tipo{font-weight:650}
.meta{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.desc{overflow-wrap:anywhere;white-space:pre-wrap}
.badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--chip);font-weight:600}
.item[data-s="aberta"] .badge{color:var(--open)}.item[data-s="atendimento"] .badge{color:var(--warn)}.item[data-s="concluida"] .badge{color:var(--ok)}
.empty{text-align:center;padding:32px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}
.err{color:var(--open);font-size:.88rem}
</style>
<div class="wrap">
  <header>
    <h1>Quadro de Ocorrências</h1>
    <p class="sub">Defesa Civil de Cajamar · registro rápido da equipe</p>
  </header>
  <div class="warn">Não registre nomes, telefones ou documentos de moradores. Este quadro apoia o acompanhamento da equipe e <b>não substitui</b> o registro formal da ocorrência.</div>
  <div class="counts" id="counts"></div>
  <div class="actions"><button class="btn primary" id="novo" type="button">+ Nova ocorrência</button></div>
  <form id="form" hidden>
    <div class="row2">
      <label>Categoria<select id="tipo" required></select></label>
      <label>Tipo<select id="subtipo" required></select></label>
    </div>
    <div class="row2">
      <label>Bairro / local<input id="local" maxlength="120" required placeholder="Ex.: Jordanésia, Rua das Flores"></label>
      <label>Data e hora<input id="quando" type="datetime-local" required></label>
    </div>
    <label>Descrição<textarea id="desc" maxlength="600" placeholder="O que foi observado e providência tomada"></textarea></label>
    <div class="err" id="err" hidden></div>
    <div class="actions"><button class="btn primary" type="submit" id="salvar">Registrar</button><button class="btn" type="button" id="cancelar">Cancelar</button></div>
  </form>
  <div class="filters">
    <select id="fstatus" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="aberta">Abertas</option><option value="atendimento">Em atendimento</option><option value="concluida">Concluídas</option></select>
    <select id="ftipo" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select>
  </div>
  <div id="aviso" class="warn" hidden></div>
  <ul class="list" id="lista"></ul>
</div>
<script>
(function(){
var CAT={
"Incêndios":["Terreno baldio","Vegetação","Residência","Apoio a fogo"],
"Enxames e Himenópteros":["Monitoramento de enxame de abelhas","Atendimento de ouvidoria – enxame","Vespas e marimbondos","Outras situações com abelhas/insetos de risco"],
"Ocorrências com Árvores":["Poda","Supressão","Corte com motosserra","Avaliação/atendimento de risco"],
"Eventos Hidrológicos e Geológicos":["Inundação","Escorregamento","Monitoramento de áreas de risco"],
"Vistorias e Avaliação de Edificações":["Vistoria estrutural","Avaliação de condições de risco em imóveis"],
"Animais Peçonhentos e Fauna":["Cobras","Manuseio e transporte de cobras","Resgate e manejo de animais"]};
var ST={aberta:"Aberta",atendimento:"Em atendimento",concluida:"Concluída"};
var $=function(i){return document.getElementById(i)};
var db=null,uid=null,canWrite=true,rows=[];
function opt(sel,vals){vals.forEach(function(v){var o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)})}
opt($("tipo"),Object.keys(CAT));opt($("ftipo"),Object.keys(CAT));
function subs(){var s=$("subtipo");s.textContent="";opt(s,CAT[$("tipo").value]||[])}
$("tipo").onchange=subs;subs();
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fmt(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function aviso(t){var a=$("aviso");a.hidden=!t;a.textContent=t||""}
$("novo").onclick=function(){$("form").hidden=false;$("quando").value=nowLocal();$("local").focus()};
$("cancelar").onclick=function(){$("form").hidden=true;$("err").hidden=true};
$("form").onsubmit=async function(e){
  e.preventDefault();
  if(!db){return}
  var b=$("salvar");b.disabled=true;$("err").hidden=true;
  try{
    var d=new Date($("quando").value);
    await db.collection("ocorrencias").add({tipo:$("tipo").value,subtipo:$("subtipo").value,local:$("local").value.trim(),descricao:$("desc").value.trim(),status:"aberta",quando:isNaN(d)?new Date().toISOString():d.toISOString(),criadoEm:new Date().toISOString(),criadoPor:uid||null});
    $("form").reset();subs();$("form").hidden=true;
  }catch(x){$("err").hidden=false;$("err").textContent=x&&x.code==="quota_exceeded"?"Limite de registros atingido. Avise o responsável pelo quadro.":"Não foi possível salvar. Verifique se você tem permissão de edição neste quadro."}
  b.disabled=false;
};
async function setStatus(id,s){
  try{await db.collection("ocorrencias").doc(id).update({status:s,atualizadoEm:new Date().toISOString(),atualizadoPor:uid||null})}
  catch(x){aviso("Não foi possível alterar o status (sem permissão de edição?).")}
}
function render(){
  var fs=$("fstatus").value,ft=$("ftipo").value;
  var c={aberta:0,atendimento:0,concluida:0};rows.forEach(function(r){if(c[r.status]!==undefined)c[r.status]++});
  var cn=$("counts");cn.textContent="";
  [["aberta","Abertas"],["atendimento","Em atendimento"],["concluida","Concluídas"]].forEach(function(p){
    var d=document.createElement("div");d.className="count";var b=document.createElement("b");b.textContent=c[p[0]];var s=document.createElement("span");s.textContent=p[1];d.append(b,s);cn.appendChild(d)});
  var ul=$("lista");ul.textContent="";
  var vis=rows.filter(function(r){return(!fs||r.status===fs)&&(!ft||r.tipo===ft)});
  if(!vis.length){
    var li=document.createElement("li");li.className="empty";
    var b=document.createElement("b");b.textContent=rows.length?"Nenhuma ocorrência com esses filtros":"Nenhuma ocorrência registrada";
    var p=document.createElement("span");p.textContent=rows.length?"Mude os filtros acima para ver outras.":"Toque em “Nova ocorrência” para o primeiro registro da equipe.";
    li.append(b,p);ul.appendChild(li);return}
  vis.forEach(function(r){
    var li=document.createElement("li");li.className="item";li.dataset.s=r.status;
    var top=document.createElement("div");top.className="top";
    var t=document.createElement("span");t.className="tipo";t.textContent=r.tipo+" · "+r.subtipo;
    var bd=document.createElement("span");bd.className="badge";bd.textContent=ST[r.status]||r.status;
    top.append(t,bd);
    var m=document.createElement("div");m.className="meta";m.textContent=r.local+" · "+fmt(r.quando);
    li.append(top,m);
    if(r.descricao){var d=document.createElement("div");d.className="desc";d.textContent=r.descricao;li.appendChild(d)}
    if(canWrite){
      var a=document.createElement("div");a.className="actions";
      Object.keys(ST).forEach(function(k){if(k===r.status)return;var bt=document.createElement("button");bt.className="btn small";bt.type="button";bt.textContent="→ "+ST[k];bt.onclick=function(){setStatus(r.id,k)};a.appendChild(bt)});
      li.appendChild(a)}
    ul.appendChild(li)});
}
$("fstatus").onchange=render;$("ftipo").onchange=render;render();
(async function(){
  try{
    var u=await window.claude.use("user");
    if(u){uid=await u.id();var w=await u.can("data.write");if(w===false){canWrite=false}}
    db=await window.claude.use("db");
  }catch(e){db=null}
  if(!db){aviso("O banco compartilhado não está disponível nesta visualização. Abra o quadro pelo link no Claude para registrar e ver ocorrências.");$("novo").disabled=true;return}
  if(!canWrite){$("novo").disabled=true;aviso("Você tem acesso somente para leitura. Peça permissão de colaborador para registrar ocorrências.")}
  db.collection("ocorrencias").orderBy("criadoEm","desc").limit(500).onSnapshot(function(s){
    rows=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()},
    function(){aviso("Conexão com o quadro interrompida. Recarregue a página.")});
})();
})();
</script>
