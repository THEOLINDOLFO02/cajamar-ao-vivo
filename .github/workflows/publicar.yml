name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # coleta o CEMADEN e republica o site (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Nas execuções agendadas, se o CEMADEN falhar o job falha e o site anterior (com a última coleta boa) permanece.
      # Em push (mudança de código), o site é publicado mesmo se a coleta falhar.
      - name: Coletar CEMADEN
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: node scripts/coletar-cemaden.mjs data/cemaden.json
      - name: Montar site
        run: |
          mkdir _site
          cp *.html _site/
          cp -r css js assets _site/
          if [ -f data/cemaden.json ]; then mkdir _site/data && cp data/cemaden.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
